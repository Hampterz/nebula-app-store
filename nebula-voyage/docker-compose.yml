version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nebula-voyage_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/hampterz/nebula-voyage:latest
    restart: on-failure
    user: "1000:1000"
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/public:/app/public
    environment:
      PORT: 3000
      DATA_DIR: /data
      NODE_ENV: production
